# Cấu hình Nginx Reverse Proxy chuẩn Production
upstream nodejs_backend {
    # Kết nối tới tiến trình Node.js (PM2 hoặc Docker)
    server 127.0.0.1:8000;
    keepalive 64;
}

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Hỗ trợ xác thực chứng chỉ SSL tự động của Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ chính HTTPS (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # Đường dẫn chứng chỉ SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # Cấu hình bảo mật giao thức TLS tối tân
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Giới hạn kích thước gói tin gửi lên tối đa 10MB
    client_max_body_size 10M;

    # Bật nén Gzip tối ưu băng thông
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Security Headers ở tầng Nginx
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Reverse Proxy chuyển tiếp request vào Node.js Backend
    location / {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;

        # Truyền thông tin gốc của Client để Node.js đọc được đúng IP thật
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
